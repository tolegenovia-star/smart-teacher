  /* =====================================================================
     7. ДВИЖОК ТРЕНАЖЁРА: шаги, ошибки, похвала, время
     opts.lesson — задание урока (есть кнопка видео, выход к заданиям)
     opts.wide   — раскладка с клавиатурой во всю ширину (s.bottom)
     ===================================================================== */
  function createSession(trainerId, total, restart, opts) {
    const o = opts || {};
    const robot = createRobot();
    const timers = new Set();
    const cleanups = [];
    const bar = h('i');
    const stepText = h('span', { class: 'count' });
    const errText = h('span', { class: 'count' });
    const title = h('h1', { class: 'task-title', tabindex: '-1' });
    const side = sideWith(robot);
    const stage = h('div', { class: 'stage', role: 'group', aria: ['stageAria'] });
    const bottom = o.wide ? h('div', { class: 'bottom' }) : null;

    const s = {
      robot: robot, stage: stage, side: side, title: title, bottom: bottom,
      step: 0, errors: 0, stepErrors: 0, locked: false, size: 0,
      startedAt: performance.now(),
      renderStep: null,   // задаёт тренажёр
      onStrong: null,     // что сделать при усиленной подсказке
      onSiteLang: null,
      onResume: null,     // после закрытия видео

      later: function (fn, ms) {
        const id = setTimeout(function () { timers.delete(id); fn(); }, ms);
        timers.add(id);
        return id;
      },
      cancel: function (id) { clearTimeout(id); timers.delete(id); },
      listen: function (target, type, fn) {
        target.addEventListener(type, fn);
        cleanups.push(function () { target.removeEventListener(type, fn); });
      },
      destroy: function () {
        timers.forEach(clearTimeout);
        timers.clear();
        cleanups.forEach(function (f) { f(); });
      },
      strong: function () { return s.stepErrors >= STRONG_AFTER; },
      calm: function () { s.stepErrors = 0; stage.classList.remove('strong'); },

      begin: function () {
        s.calm();
        s.locked = false;
        bindText(stepText, 'step', { n: s.step + 1, total: total });
        bindText(errText, 'errors', { n: s.errors });
        bar.style.width = (s.step / total * 100) + '%';
        s.renderStep();
      },
      fail: function (hintKey, params, strongKey, strongParams) {
        if (s.locked) return;
        s.errors++;
        s.stepErrors++;
        bindText(errText, 'errors', { n: s.errors });
        if (s.strong()) {
          stage.classList.add('strong');
          robot.say(strongKey || hintKey, strongKey ? strongParams : params, 'hint');
          if (s.onStrong) s.onStrong();
        } else {
          robot.say(hintKey, params, 'error');
        }
      },
      pass: function (key, params, delay) {
        s.locked = true;
        stage.classList.remove('strong');
        const praise = 'praise' + Math.floor(Math.random() * 3);
        robot.say(key || praise, Object.assign({ praise: function () { return t(praise); } }, params), 'success');
        bar.style.width = ((s.step + 1) / total * 100) + '%';
        s.later(function () {
          s.step++;
          if (s.step < total) s.begin(); else s.finish();
        }, delay);
      },
      finish: function () {
        const r = rate(s.errors, s.size);
        const res = {
          stars: r.stars, status: r.status, errors: s.errors,
          timeSec: Math.max(1, Math.round((performance.now() - s.startedAt) / 1000))
        };
        Store.saveResult(trainerId, res);
        showResult(trainerId, res, restart);
      }
    };

    const back = !o.lesson ? ['home', function () { showHome(); }]
      : isLevel(trainerId) ? ['levelsBack', showLevels] : ['tasksBack', showTasks];
    const exit = button('plain small', back[0], function () {
      openModal('exitTitle', 'exitText', null, 'exitYes', 'exitNo', back[1]);
    });
    const videoBtn = o.lesson ? button('plain small', 'videoBtn', openVideoModal) : null;
    if (videoBtn) bindAttr(videoBtn, 'aria-label', 'videoAgain');
    show(h('section', { class: 'screen train' + (o.wide ? ' wide' : '') },
      h('div', { class: 'train-bar' }, exit, videoBtn, stepText, h('div', { class: 'progress', 'aria-hidden': 'true' }, bar), errText),
      h('div', { class: 'split' }, side, h('div', { class: 'work' }, title, stage)), bottom), false);
    session = s; // после show(), который завершает предыдущую сессию
    return s;
  }

  // Схема мыши под роботом: какую кнопку нажимать
  function createMouseHelp(s) {
    const text = h('span');
    const box = h('div', { class: 'mouse-help' }, h('span', { svg: ART.mouseHelp, 'aria-hidden': 'true' }), text);
    s.side.append(box);
    s.onStrong = function () { box.classList.add('strong-help'); };
    return {
      set: function (btn, key) {
        box.hidden = !btn;
        box.classList.remove('strong-help');
        if (!btn) return;
        box.setAttribute('data-btn', btn);
        bindText(text, key);
      }
    };
  }

  // Двойной клик: медленный второй клик — одна ошибка, а не две
  function createDoubleClick(s, keys, ok) {
    let first = 0, timer = null;
    function drop() { s.cancel(timer); timer = null; first = 0; }
    return {
      drop: drop,
      hit: function () {
        const now = performance.now();
        if (!first) {
          first = now;
          timer = s.later(function () { drop(); s.fail(keys.one, null, keys.strong); }, SLOW_CLICK_MS);
          return;
        }
        const gap = now - first;
        drop();
        if (gap <= DOUBLE_CLICK_MS) ok(); else s.fail('dblSlow', null, keys.strong);
      }
    };
  }

  // Имитация выбора языка в панели задач Windows
  function createTray(onToggle, onChoose) {
    const label = h('span');
    const tray = h('button', { class: 'tray-lang', type: 'button', 'aria-haspopup': 'menu', 'aria-expanded': 'false', on: { click: function () { api.toggle(menu.hidden); } } },
      label, h('span', { class: 'arrow', svg: ART.arrow, 'aria-hidden': 'true' }));
    function option(m, short, full) {
      return h('button', { type: 'button', role: 'menuitemradio', 'data-mode': m, on: { click: function () { onChoose(m); } } },
        h('b', { text: short }), h('span', { text: full }));
    }
    const rus = option('rus', WIN.rus, WIN.rusName);
    const kaz = option('kaz', WIN.kaz, WIN.kazName);
    const menu = h('div', { class: 'tray-menu', role: 'menu', hidden: true }, rus, kaz);
    const start = h('span', { class: 'start', 'aria-hidden': 'true', svg: '<i></i><i></i><i></i><i></i>' });
    const api = {
      bar: h('div', { class: 'taskbar' }, start, menu, tray),
      tray: tray, menu: menu, rus: rus, kaz: kaz,
      toggle: function (open) {
        menu.hidden = !open;
        tray.setAttribute('aria-expanded', String(open));
        onToggle(open);
      },
      show: function (mode) {
        label.textContent = WIN[mode];
        bindAttr(tray, 'aria-label', 'langAria', { l: WIN[mode] });
        [rus, kaz].forEach(function (b) { b.setAttribute('aria-checked', String(b.getAttribute('data-mode') === mode)); });
      }
    };
    return api;
  }

  /* =====================================================================
     8. ТРЕНАЖЁР МЫШИ
     Цели намеренно не нажимаются с клавиатуры: здесь учимся именно мыши.
     ===================================================================== */
  function startMouse() {
    const s = createSession('mouse', 4, startMouse);
    const stage = s.stage;
    const help = createMouseHelp(s);
    let task = {};

    function makeTarget(name, art, left, top) {
      const el = h('div', { class: 'target ' + name, role: 'img', aria: [name] }, h('div', { class: 'arrow', svg: ART.arrow }));
      el.insertAdjacentHTML('beforeend', art);
      el.style.left = left + '%';
      el.style.top = top + '%';
      stage.append(el);
      return el;
    }
    function intro(key, btn, btnText) {
      bindText(s.title, key + 'Title');
      s.robot.say(key + 'Robot');
      help.set(btn, btnText);
    }

    /* --- 1. Одиночный клик --- */
    function taskClick() {
      intro('click', 'left', 'btnLeft');
      const el = makeTarget('balloon', ART.balloon, pick([25, 50, 75]), 58);
      return {
        click: function (e) {
          if (el.contains(e.target)) { el.classList.add('gone'); s.pass(null, null, 1700); }
          else s.fail('clickMiss', null, 'clickStrong');
        },
        context: function () { s.fail('clickButton', null, 'clickStrong'); }
      };
    }

    /* --- 2. Двойной клик --- */
    function taskDouble() {
      intro('dbl', 'left', 'btnDouble');
      const el = makeTarget('folder', ART.folder, 50, 60);
      const dbl = createDoubleClick(s, { one: 'dblOne', strong: 'dblStrong' }, function () {
        el.querySelector(':scope > svg').outerHTML = ART.folderOpen;
        el.classList.add('won');
        s.pass('dblOk', null, 1900);
      });
      return {
        click: function (e) {
          if (el.contains(e.target)) { dbl.hit(); return; }
          dbl.drop();
          s.fail('dblMiss', null, 'dblStrong');
        },
        context: function () { dbl.drop(); s.fail('dblButton', null, 'dblStrong'); }
      };
    }

    /* --- 3. Правый клик --- */
    function taskRight() {
      intro('right', 'right', 'btnRight');
      const el = makeTarget('monitor', ART.monitor, 42, 56);
      return {
        click: function (e) {
          s.fail(el.contains(e.target) ? 'rightButton' : 'rightMiss', null, 'rightStrong');
        },
        context: function (e) {
          if (!el.contains(e.target)) { s.fail('rightMiss', null, 'rightStrong'); return; }
          showWinMenu(e);
          s.pass('rightOk', null, 3000);
        }
      };
    }
    // Картинка меню Windows рядом с курсором: показываем, что открывает правый клик
    function showWinMenu(e) {
      const menu = h('div', { class: 'win-menu', 'aria-hidden': 'true' },
        h('ul', null, h('li', { class: 'on', text: WIN.create + '  ▸' })),
        h('ul', null, h('li', { text: WIN.folder }), h('li', { text: WIN.word })));
      stage.append(menu);
      const box = stage.getBoundingClientRect();
      const x = Math.min(e.clientX - box.left, stage.clientWidth - menu.offsetWidth - 8);
      const y = Math.min(e.clientY - box.top, stage.clientHeight - menu.offsetHeight - 8);
      menu.style.left = Math.max(8, x) + 'px';
      menu.style.top = Math.max(8, y) + 'px';
    }

    /* --- 4. Перетаскивание --- */
    function taskDrag() {
      intro('drag', 'left', 'btnHold');
      const basket = makeTarget('basket', ART.basket, 78, 64);
      basket.querySelector('.arrow').remove();
      stage.append(h('div', { class: 'path-arrow', svg: ART.pathArrow }));
      const apple = makeTarget('apple', ART.apple, 20, 64);
      let drag = null, returning = false;

      function move(dx, dy) {
        apple.style.setProperty('--dx', dx + 'px');
        apple.style.setProperty('--dy', dy + 'px');
      }
      function goBack() {
        apple.classList.remove('held');
        apple.classList.add('back');
        move(0, 0);
        drag = null;
        returning = true; // пока яблоко едет назад, его не хватаем
        s.later(function () { returning = false; apple.classList.remove('back'); }, 420);
      }
      function overBasket() {
        const a = apple.getBoundingClientRect(), b = basket.getBoundingClientRect();
        const x = a.left + a.width / 2, y = a.top + a.height / 2, pad = 24;
        return x > b.left - pad && x < b.right + pad && y > b.top - pad && y < b.bottom + pad;
      }
      apple.addEventListener('pointerdown', function (e) {
        if (s.locked || drag || returning || e.button !== 0) return;
        e.preventDefault();
        apple.classList.add('held');
        drag = { id: e.pointerId, x: e.clientX, y: e.clientY, far: 0 };
        try { apple.setPointerCapture(e.pointerId); } catch (err) { /* захват не обязателен */ }
      });
      apple.addEventListener('pointermove', function (e) {
        if (!drag || e.pointerId !== drag.id) return;
        const dx = e.clientX - drag.x, dy = e.clientY - drag.y;
        drag.far = Math.max(drag.far, Math.hypot(dx, dy));
        move(dx, dy);
      });
      apple.addEventListener('pointerup', function (e) {
        if (!drag || e.pointerId !== drag.id) return;
        if (overBasket()) {
          const a = apple.getBoundingClientRect(), b = basket.getBoundingClientRect();
          const dx = e.clientX - drag.x + (b.left + b.width / 2) - (a.left + a.width / 2);
          const dy = e.clientY - drag.y + (b.top + b.height * 0.28) - (a.top + a.height / 2);
          drag = null;
          apple.classList.remove('held');
          apple.classList.add('back');
          move(dx, dy);
          basket.classList.add('won');
          s.pass('dragOk', null, 1900);
        } else {
          const onlyClick = drag.far < 8;
          goBack();
          s.fail(onlyClick ? 'dragClick' : 'dragDrop', null, 'dragStrong');
        }
      });
      // система прервала жест — это не ошибка ребёнка
      apple.addEventListener('pointercancel', function (e) { if (drag && e.pointerId === drag.id) goBack(); });
      return {
        down: function (e) {
          if (e.button === 0 && !returning && !apple.contains(e.target)) s.fail('dragMiss', null, 'dragStrong');
        },
        context: function () { if (drag) goBack(); s.fail('dragButton', null, 'dragStrong'); }
      };
    }

    const order = [taskClick, taskDouble, taskRight, taskDrag];
    s.renderStep = function () {
      stage.textContent = '';
      task = order[s.step]();
    };
    s.listen(stage, 'click', function (e) { if (!s.locked && task.click) task.click(e); });
    s.listen(stage, 'pointerdown', function (e) { if (!s.locked && task.down) task.down(e); });
    s.listen(stage, 'dragstart', function (e) { e.preventDefault(); });
    // Меню браузера выключено на всё время тренажёра мыши
    s.listen(document, 'contextmenu', function (e) {
      e.preventDefault();
      if (!s.locked && !modalOpen && stage.contains(e.target) && task.context) task.context(e);
    });
    s.begin();
  }

  /* =====================================================================
     9. ТРЕНАЖЁР КЛАВИАТУРЫ
     Клавиши стоят как в настоящей казахской раскладке Windows:
     ә і ң ғ ү ұ қ ө һ — в верхнем ряду, на месте цифр.
     ===================================================================== */
  const DIGIT_CODES = ['Backquote', 'Digit1', 'Digit2', 'Digit3', 'Digit4', 'Digit5', 'Digit6', 'Digit7', 'Digit8', 'Digit9', 'Digit0', 'Minus', 'Equal'];
  const LAYOUT = [
    { codes: DIGIT_CODES, rus: 'ё1234567890-=', kaz: '("әіңғ,.үұқөһ' },
    { codes: ['KeyQ', 'KeyW', 'KeyE', 'KeyR', 'KeyT', 'KeyY', 'KeyU', 'KeyI', 'KeyO', 'KeyP', 'BracketLeft', 'BracketRight', 'Backslash'], rus: 'йцукенгшщзхъ\\', kaz: 'йцукенгшщзхъ\\' },
    { codes: ['KeyA', 'KeyS', 'KeyD', 'KeyF', 'KeyG', 'KeyH', 'KeyJ', 'KeyK', 'KeyL', 'Semicolon', 'Quote'], rus: 'фывапролджэ', kaz: 'фывапролджэ' },
    { codes: ['KeyZ', 'KeyX', 'KeyC', 'KeyV', 'KeyB', 'KeyN', 'KeyM', 'Comma', 'Period', 'Slash'], rus: 'ячсмитьбю.', kaz: 'ячсмитьбю№' }
  ];

  function startKeyboard() {
    const steps = [{ type: 'lang' }]
      .concat(shuffle(KAZ_LETTERS).map(function (l) { return { type: 'letter', letter: l }; }))
      .concat([{ type: 'word', word: pick(WORDS) }]);
    const s = createSession('keyboard', steps.length, startKeyboard);
    const stage = s.stage;
    let mode = 'rus';     // язык имитации, не настоящая раскладка Windows
    let typed = 0;        // сколько букв слова уже набрано
    const keys = [];      // { btn, label, rus, kaz, code }

    /* --- Разметка --- */
    stage.classList.add('kb-stage');
    const top = h('div', { class: 'kb-top' });
    const board = h('div', { class: 'keys', role: 'group', aria: ['keyboardAria'] });
    LAYOUT.forEach(function (row) {
      const line = h('div', { class: 'krow' });
      row.codes.forEach(function (code, i) {
        const label = h('span');
        const key = { code: code, rus: row.rus[i], kaz: row.kaz[i], label: label };
        key.btn = h('button', { class: 'key', type: 'button', on: { click: function () { press(key); } } },
          label, h('span', { class: 'arrow', svg: ART.arrow, 'aria-hidden': 'true' }));
        keys.push(key);
        line.append(key.btn);
      });
      board.append(line);
    });
    const lang = createTray(onToggle, choose);
    const tray = lang.tray, menu = lang.menu, optRus = lang.rus, optKaz = lang.kaz;
    stage.append(top, board, lang.bar);

    /* --- Язык имитации --- */
    function applyMode() {
      keys.forEach(function (k) {
        const ch = k[mode];
        k.label.textContent = ch;
        bindAttr(k.btn, 'aria-label', 'keyAria', { k: ch });
        k.btn.classList.toggle('kaz', mode === 'kaz' && KAZ_LETTERS.includes(ch));
        k.btn.classList.toggle('sign', !/\p{L}/u.test(ch));
      });
      lang.show(mode);
      highlight();
    }
    function toggleMenu(open) { lang.toggle(open); }
    function onToggle(open) {
      if (open) {
        (mode === 'rus' ? optKaz : optRus).focus({ preventScroll: true });
        if (!s.locked && mode === 'rus') s.robot.say('langMenu', null, 'hint');
      }
      highlight();
    }
    function choose(m) {
      if (s.locked) { toggleMenu(false); return; }
      const before = mode;
      mode = m;
      toggleMenu(false);
      applyMode();
      tray.focus({ preventScroll: true });
      const step = steps[s.step];
      if (step.type === 'lang') {
        if (m === 'kaz') { s.pass('langOk', null, 2000); highlight(); }
        else s.fail('langRus', null, 'langStrong');
      } else if (before !== m) {
        if (m === 'kaz') sayTask(); else s.robot.say('langFirst', null, 'hint');
      }
    }

    /* --- Подсветка при усиленной подсказке --- */
    function wanted() {
      const step = steps[s.step];
      if (step.type === 'letter') return step.letter;
      if (step.type === 'word') return step.word[typed];
      return null;
    }
    function highlight() {
      const on = s.strong() && !s.locked;
      const goal = wanted();
      const needSwitch = mode === 'rus';
      keys.forEach(function (k) { k.btn.classList.toggle('glow', on && !needSwitch && k.kaz === goal); });
      tray.classList.toggle('glow', on && needSwitch && menu.hidden);
      optKaz.classList.toggle('glow', on && needSwitch);
    }
    s.onStrong = highlight;

    /* --- Нажатие клавиши --- */
    function flash(key, cls) {
      key.btn.classList.add(cls);
      s.later(function () { key.btn.classList.remove(cls); }, 450);
    }
    function press(key) {
      if (s.locked || modalOpen) return;
      if (!menu.hidden) toggleMenu(false);
      const step = steps[s.step];
      const ch = key[mode];
      if (mode === 'rus') { // буквы до переключения языка
        flash(key, 'miss');
        s.fail('langFirst');
        return;
      }
      if (step.type === 'lang') return;
      const goal = wanted();
      if (ch !== goal) {
        flash(key, 'miss');
        s.fail(step.type === 'word' ? 'wordWrong' : 'letterWrong', { k: ch, l: goal }, 'letterStrong', { l: goal });
        return;
      }
      flash(key, 'hit');
      if (step.type === 'letter') {
        s.pass('letterOk', { l: goal }, 1500);
      } else {
        typed++;
        s.stepErrors = 0; // каждая буква слова получает свои подсказки
        stage.classList.remove('strong');
        drawCells(step.word);
        if (typed === step.word.length) s.pass('wordOk', { w: step.word }, 2200);
        else s.robot.say('wordNext', { l: step.word[typed] }, 'success');
      }
      highlight();
    }

    /* --- Задания --- */
    function drawCells(word) {
      const cells = h('div', { class: 'cells', role: 'img', aria: ['cellsAria', { v: word.slice(0, typed) || '—' }] });
      word.split('').forEach(function (ch, i) {
        cells.append(h('span', { class: 'cell' + (i < typed ? ' ok' : i === typed ? ' now' : ''), text: i < typed ? ch : '' }));
      });
      top.textContent = '';
      top.append(h('div', { class: 'word-box' }, h('span', { class: 'sample', text: word }), cells));
    }
    function sayTask() {
      const step = steps[s.step];
      if (step.type === 'lang') s.robot.say('langRobot');
      else if (step.type === 'letter') s.robot.say('letterRobot', { l: step.letter });
      else s.robot.say(typed ? 'wordNext' : 'wordRobot', { l: step.word[typed] });
    }
    s.renderStep = function () {
      const step = steps[s.step];
      typed = 0;
      top.textContent = '';
      if (step.type === 'lang') {
        bindText(s.title, 'langTitle');
        top.append(h('div', { class: 'lang-show', 'aria-hidden': 'true' },
          h('span', { text: WIN.rus }), '→', h('span', { text: WIN.kaz })));
      } else if (step.type === 'letter') {
        bindText(s.title, 'letterTitle', { l: step.letter });
        top.append(h('div', { class: 'big-letter', 'aria-hidden': 'true', text: step.letter.toUpperCase() + ' ' + step.letter }));
      } else {
        bindText(s.title, 'wordTitle', { w: step.word });
        drawCells(step.word);
      }
      sayTask();
      highlight();
    };

    // Ребёнок перепутал язык сайта с языком клавиатуры — мягко подсказываем
    s.onSiteLang = function () {
      if (!s.locked && steps[s.step].type === 'lang') s.robot.say('langSite', null, 'hint');
    };
    // Можно нажимать и настоящие клавиши: смотрим на место клавиши, а не на раскладку
    s.listen(document, 'keydown', function (e) {
      if (modalOpen) return;
      if (e.key === 'Escape' && !menu.hidden) { toggleMenu(false); tray.focus(); return; }
      if (e.ctrlKey || e.altKey || e.metaKey || e.repeat) return;
      const key = keys.find(function (k) { return k.code === e.code; });
      if (!key) return;
      e.preventDefault();
      flash(key, 'down');
      press(key);
    });
    s.listen(document, 'pointerdown', function (e) {
      if (!menu.hidden && !menu.contains(e.target) && !tray.contains(e.target)) toggleMenu(false);
    });

    applyMode();
    s.begin();
  }

  /* =====================================================================
     10. ПОЛНАЯ КЛАВИАТУРА НА ЭКРАНЕ (задания урока)
     Казахская раскладка Windows + клавиши управления.
     ===================================================================== */
  const CTRL = { Backspace: 'Backspace', Enter: 'Enter', ShiftLeft: 'Shift', ShiftRight: 'Shift', Delete: 'Delete', Tab: 'Tab', CapsLock: 'Caps Lock', ControlLeft: 'Ctrl', ControlRight: 'Ctrl', MetaLeft: 'Win', AltLeft: 'Alt', AltRight: 'Alt', Home: 'Home', End: 'End', ArrowUp: '↑', ArrowLeft: '←', ArrowDown: '↓', ArrowRight: '→' };
  // [код клавиши, ширина]; null — пустое место; '|' — граница правого блока
  const BOARD = [
    DIGIT_CODES.map(function (c) { return [c, 1]; }).concat([['Backspace', 2], '|', ['Home', 1.5], ['End', 1.5]]),
    [['Tab', 1.5]].concat(LAYOUT[1].codes.slice(0, 12).map(function (c) { return [c, 1]; }), [['Backslash', 1.5], '|', ['Delete', 3]]),
    [['CapsLock', 1.75]].concat(LAYOUT[2].codes.map(function (c) { return [c, 1]; }), [['Enter', 2.25], '|', [null, 3]]),
    [['ShiftLeft', 2.25]].concat(LAYOUT[3].codes.map(function (c) { return [c, 1]; }), [['ShiftRight', 2.75], '|', [null, 1], ['ArrowUp', 1], [null, 1]]),
    [['ControlLeft', 1.5], ['MetaLeft', 1.25], ['AltLeft', 1.25], ['Space', 7.5], ['AltRight', 1.25], ['ControlRight', 2.25], '|', ['ArrowLeft', 1], ['ArrowDown', 1], ['ArrowRight', 1]]
  ];
  // Код клавиши → знак без Shift и с Shift
  const KEY_CHAR = {};
  LAYOUT.forEach(function (row) { row.codes.forEach(function (c, i) { KEY_CHAR[c] = row.kaz[i]; }); });
  const SHIFT_CHAR = { '!': 'Digit1', '?': 'Slash', ';': 'Digit6', ':': 'Digit7' };

  /** Какую клавишу нажать, чтобы получить знак */
  function keyFor(ch) {
    if (ch === '\n') return { code: 'Enter', shift: false };
    if (ch === ' ') return { code: 'Space', shift: false };
    if (SHIFT_CHAR[ch]) return { code: SHIFT_CHAR[ch], shift: true };
    const low = ch.toLowerCase();
    const code = Object.keys(KEY_CHAR).find(function (c) { return KEY_CHAR[c] === low; });
    return { code: code, shift: low !== ch };
  }
  /** Имя знака для речи робота (пробел и Enter — словами) */
  function charName(ch) {
    if (ch === ' ') return function () { return t('kn_Space'); };
    return ch === '\n' ? 'Enter' : ch;
  }

  function createBoard(s, onPress) {
    const root = h('div', { class: 'board' + (onPress ? ' live' : ''), role: 'group', aria: ['keyboardAria'] });
    const map = {};
    BOARD.forEach(function (row) {
      const line = h('div', { class: 'brow' });
      row.forEach(function (item) {
        if (item === '|') { line.append(h('span', { class: 'bsplit' })); return; }
        const code = item[0];
        let el;
        if (!code) el = h('span', { class: 'bgap' });
        else {
          const ch = KEY_CHAR[code];
          const cls = ch ? (KAZ_LETTERS.includes(ch) ? ' kaz' : /\p{L}/u.test(ch) ? '' : ' sign') : code === 'Space' ? '' : ' ctrl';
          el = h('span', { class: 'bkey' + cls });
          if (code === 'Space') bindText(el, 'kn_Space');
          else el.textContent = ch || CTRL[code];
          map[code] = el;
          // клик не забирает фокус: настоящие Enter и пробел работают дальше
          el.addEventListener('mousedown', function (e) { e.preventDefault(); });
          if (onPress) el.addEventListener('click', function () { onPress(code); });
        }
        el.style.flexGrow = item[1];
        line.append(el);
      });
      root.append(line);
    });
    s.bottom.append(root);
    return {
      has: function (code) { return Boolean(map[code]); },
      flash: function (code, cls) {
        const el = map[code];
        if (!el) return;
        el.classList.add(cls);
        s.later(function () { el.classList.remove(cls); }, cls === 'down' ? 180 : 500);
      },
      glow: function (codes) {
        Object.keys(map).forEach(function (c) { map[c].classList.toggle('glow', codes.includes(c)); });
      }
    };
  }
  // Настоящая клавиша: не мешаем кнопкам, окнам и сочетаниям клавиш
  function typingBlocked(s, e) {
    const el = document.activeElement;
    return s.locked || modalOpen || e.ctrlKey || e.altKey || e.metaKey || (el && el.tagName === 'BUTTON');
  }
  // После щелчка мышью по кнопке фокус возвращается к заданию
  function keepFocus(s, el) {
    s.listen(document, 'click', function (e) {
      if (e.detail > 0 && !modalOpen && document.contains(el)) el.focus({ preventScroll: true });
    });
    s.onResume = function () { el.focus({ preventScroll: true }); };
  }

  /* =====================================================================
     11. ЗАДАНИЕ 1: ГЛАВНЫЕ КЛАВИШИ (9-сабақ, цель 2.1.1.2)
     ===================================================================== */
  const MAIN_KEYS = {
    Space: { codes: ['Space'], before: 'ана|әке', after: 'ана |әке' },
    Enter: { codes: ['Enter'], before: 'Күз.|Қыс.', after: 'Күз.\n|Қыс.' },
    Shift: { codes: ['ShiftLeft', 'ShiftRight'], before: 'айша', after: 'Айша' },
    Backspace: { codes: ['Backspace'], before: 'анаа|', after: 'ана|' },
    Delete: { codes: ['Delete'], before: '|аана', after: '|ана' }
  };
  function mainKeyName(id) { return id === 'Space' ? function () { return t('kn_Space'); } : id; }

  function startKeys() {
    const ids = Object.keys(MAIN_KEYS);
    const steps = [{ type: 'letters' }, { type: 'control' }]
      .concat(ids.map(function (id) { return { type: 'find', id: id }; }))
      .concat(shuffle(ids).map(function (id) { return { type: 'quiz', id: id }; }));
    const s = createSession('lessonKeys', steps.length, startKeys, { lesson: true, wide: true });
    const board = createBoard(s, press);
    const demo = h('div', { class: 'demo', tabindex: '-1' });
    s.stage.append(demo);
    keepFocus(s, demo);

    function isChar(code) { return Boolean(KEY_CHAR[code]); }
    function right(step, code) {
      if (step.type === 'letters') return isChar(code);
      if (step.type === 'control') return Boolean(CTRL[code]);
      return MAIN_KEYS[step.id].codes.includes(code);
    }
    function keyName(code) {
      if (code === 'Space') return mainKeyName('Space');
      return KEY_CHAR[code] || CTRL[code];
    }
    // '|' в примере — мигающий курсор текста
    function box(text, cls) {
      const el = h('div', { class: 'box ' + (cls || '') });
      text.split('|').forEach(function (part, i) {
        if (i) el.append(h('i'));
        el.append(part);
      });
      return el;
    }
    function drawDemo(step, solved) {
      demo.textContent = '';
      if (!step.id) { demo.append(h('span', { class: 'ask', 'aria-hidden': 'true', text: step.type === 'letters' ? 'ә  б  қ' : 'Ctrl  Enter' })); return; }
      const k = MAIN_KEYS[step.id];
      demo.append(box(k.before));
      if (solved || step.type === 'quiz') demo.append('→', box(k.after, 'after'));
    }
    function highlight() {
      const step = steps[s.step];
      if (!s.strong() || s.locked) { board.glow([]); return; }
      if (step.type === 'letters') board.glow(Object.keys(KEY_CHAR));
      else if (step.type === 'control') board.glow(Object.keys(CTRL));
      else board.glow(MAIN_KEYS[step.id].codes);
    }
    s.onStrong = highlight;

    function press(code) {
      if (s.locked || modalOpen) return;
      const step = steps[s.step];
      if (right(step, code)) {
        board.flash(code, 'hit');
        drawDemo(step, true);
        s.pass(step.id ? 'kOk' : null, { w: mainKeyName(step.id) }, 1700);
      } else {
        board.flash(code, 'miss');
        const p = { k: keyName(code), w: mainKeyName(step.id) };
        if (!step.id) s.fail('kGroupWrong', null, 'kGroupStrong');
        else s.fail(step.type === 'quiz' ? 'kQuizWrong' : 'kWrong', p, 'kStrong', p);
      }
      highlight();
    }

    s.renderStep = function () {
      const step = steps[s.step];
      if (step.type === 'letters') { bindText(s.title, 'kLetters'); s.robot.say('kLettersRobot'); }
      else if (step.type === 'control') { bindText(s.title, 'kControl'); s.robot.say('kControlRobot'); }
      else if (step.type === 'find') { bindText(s.title, 'kFind', { w: mainKeyName(step.id) }); s.robot.say('kd_' + step.id); }
      else { bindText(s.title, 'kQuiz'); s.robot.say('q_' + step.id); }
      drawDemo(step, false);
      highlight();
      demo.focus({ preventScroll: true });
    };
    s.listen(document, 'keydown', function (e) {
      if (modalOpen || e.repeat) return;
      const el = document.activeElement;
      if (el && el.tagName === 'BUTTON') return;
      const code = e.code === 'NumpadEnter' ? 'Enter' : e.code;
      // Tab, Ctrl, Alt, Win служебные: на настоящей клавиатуре не проверяем
      if (!board.has(code) || ['Tab', 'ControlLeft', 'ControlRight', 'AltLeft', 'AltRight', 'MetaLeft', 'CapsLock'].includes(code)) return;
      if (e.ctrlKey || e.altKey || e.metaKey) return;
      e.preventDefault();
      press(code);
    });
    s.begin();
  }

  /* =====================================================================
     12. ЗАДАНИЕ 2: ОТКРЫТЬ ДОКУМЕНТ WORD (как в видео)
     Меню Windows на русском; всё происходит внутри учебного стола.
     ===================================================================== */
  function startWord() {
    const s = createSession('lessonWord', 6, startWord, { lesson: true });
    const stage = s.stage;
    const help = createMouseHelp(s);
    const word = 'қала';
    let mode = 'rus', typed = 0, docName = WIN.word, cmenu = null;
    let dbl = null, input = null, sheet = null;

    stage.classList.add('desk-stage');
    bindAttr(stage, 'aria-label', 'deskAria');
    const bin = h('div', { class: 'dicon bin', svg: ART.bin });
    bin.append(WIN.bin);
    const desk = h('div', { class: 'desk' }, bin);
    const lang = createTray(function () { highlight(); if (!lang.menu.hidden && s.step === 4 && !s.locked) s.robot.say('langMenu', null, 'hint'); }, chooseLang);
    stage.append(desk, lang.bar);
    lang.show(mode);
    const doc = h('div', { class: 'dicon doc', svg: ART.lessonWord });
    const label = h('span', { text: docName });

    function highlight() {
      const on = s.strong() && !s.locked;
      doc.classList.toggle('glow', on && s.step === 3);
      lang.tray.classList.toggle('glow', on && s.step === 4 && lang.menu.hidden);
      lang.kaz.classList.toggle('glow', on && s.step === 4);
      desk.querySelectorAll('[data-goal]').forEach(function (li) { li.classList.toggle('glow', on && s.step === 1); });
    }
    const helpStrong = s.onStrong;
    s.onStrong = function () { helpStrong(); highlight(); };

    /* --- Контекстное меню --- */
    function list(items, goal, onItem) {
      const ul = h('ul', { class: 'cmenu', role: 'menu', on: { click: function (e) { e.stopPropagation(); } } });
      items.forEach(function (name) {
        if (name === '-') { ul.append(h('li', { class: 'sep', 'aria-hidden': 'true' })); return; }
        const li = h('li', { role: 'menuitem' }, h('span', { text: name }), name === WIN.create ? h('span', { text: '▸' }) : null);
        if (name === goal) li.setAttribute('data-goal', '');
        onItem(li, name);
        ul.append(li);
      });
      return ul;
    }
    function place(el, x, y) {
      desk.append(el);
      el.style.left = Math.max(4, Math.min(x, desk.clientWidth - el.offsetWidth - 4)) + 'px';
      el.style.top = Math.max(4, Math.min(y, desk.clientHeight - el.offsetHeight - 4)) + 'px';
    }
    function openMenu(e) {
      closeAllMenus();
      let sub = null, closing = null;
      const r = desk.getBoundingClientRect();
      const wrong = function (name, goal) { s.fail('w2Wrong', { k: name, w: goal }, 'w2Strong'); };
      const main = list(WIN.menu, WIN.create, function (li, name) {
        const openSub = function () {
          if (sub) return;
          li.classList.add('on');
          sub = list(WIN.sub, WIN.word, function (item, itemName) {
            item.addEventListener('click', function (ev) {
              ev.stopPropagation();
              if (s.locked || s.step !== 1) return;
              if (itemName === WIN.word) createDoc(); else wrong(itemName, WIN.word);
            });
          });
          sub.addEventListener('mouseenter', function () { s.cancel(closing); });
          desk.append(sub); // сначала в дерево, чтобы узнать ширину
          const left = main.offsetLeft + main.offsetWidth - 4;
          place(sub, left + sub.offsetWidth > desk.clientWidth - 4 ? Math.max(4, main.offsetLeft - sub.offsetWidth + 4) : left, main.offsetTop + li.offsetTop);
          highlight();
        };
        const closeSub = function () { if (sub) { sub.remove(); sub = null; main.querySelectorAll('.on').forEach(function (x) { x.classList.remove('on'); }); } };
        // закрываем не сразу: рука ребёнка может задеть соседнюю строку
        li.addEventListener('mouseenter', function () {
          s.cancel(closing);
          if (name === WIN.create) openSub(); else closing = s.later(closeSub, 500);
        });
        li.addEventListener('click', function (ev) {
          ev.stopPropagation();
          if (s.locked || s.step !== 1) return;
          if (name === WIN.create) openSub(); else wrong(name, WIN.create);
        });
      });
      place(main, e.clientX - r.left, e.clientY - r.top);
      // вложенному меню нужно место справа или слева; если нет — сдвигаем главное
      const probe = list(WIN.sub, '', function () { });
      desk.append(probe);
      const room = desk.clientWidth - main.offsetWidth - probe.offsetWidth - 4;
      const leftFits = main.offsetLeft >= probe.offsetWidth + 4;
      probe.remove();
      if (room > 4 && main.offsetLeft > room && !leftFits) main.style.left = room + 'px';
      cmenu = main;
      highlight();
    }
    function closeAllMenus() {
      desk.querySelectorAll('.cmenu').forEach(function (m) { m.remove(); });
      cmenu = null;
    }

    /* --- Документ: создать, назвать, открыть --- */
    function createDoc() {
      closeAllMenus();
      doc.append(label);
      desk.append(doc);
      s.pass('w2Ok', null, 1500);
    }
    function askName() {
      input = h('input', { type: 'text', maxlength: '24', autocomplete: 'off', spellcheck: 'false', aria: ['w3Aria'] });
      input.value = WIN.word;
      label.replaceWith(input);
      input.focus();
      input.select();
      input.addEventListener('keydown', function (e) {
        e.stopPropagation();
        if (e.key !== 'Enter' || s.locked) return;
        e.preventDefault();
        const name = input.value.trim();
        if (!name) { s.fail('w3Empty', null, 'w3Strong'); return; }
        if (name === WIN.word) { s.fail('w3Same', null, 'w3Strong'); input.select(); return; }
        docName = name;
        label.textContent = name;
        input.replaceWith(label);
        s.pass('w3Ok', null, 1500);
      });
    }
    function openWindow() {
      doc.classList.remove('glow');
      sheet = h('div', { class: 'sheet' });
      desk.append(h('div', { class: 'dwin' }, h('div', { class: 'bar', t: ['paperName', { doc: docName }] }), sheet));
      drawSheet();
    }
    function drawSheet() {
      sheet.textContent = '';
      if (s.step === 5) sheet.append(h('p', { class: 'want', text: word }));
      sheet.append(word.slice(0, typed), h('i', { 'aria-hidden': 'true' }));
    }

    /* --- Язык и набор слова --- */
    function chooseLang(m) {
      if (s.locked) { lang.toggle(false); return; }
      if (s.step !== 4) { lang.toggle(false); return; }
      mode = m;
      lang.show(m);
      lang.toggle(false);
      lang.tray.focus({ preventScroll: true });
      if (m === 'kaz') { s.pass('langOk', null, 1600); highlight(); }
      else s.fail('langRus', null, 'langStrong');
    }
    function typeKey(e) {
      if (s.step !== 5 || s.locked || modalOpen || e.repeat || e.ctrlKey || e.altKey || e.metaKey) return;
      const ch = KEY_CHAR[e.code]; // место клавиши, а не раскладка Windows
      if (!ch) return;
      e.preventDefault();
      const goal = word[typed];
      if (ch !== goal) {
        s.fail('wordWrong', { k: ch, l: goal }, KAZ_LETTERS.includes(goal) ? 'w6StrongKaz' : 'w6Strong', { l: goal });
        return;
      }
      typed++;
      s.calm();
      drawSheet();
      if (typed === word.length) s.pass('w6Ok', null, 2200);
      else s.robot.say('wordNext', { l: word[typed] }, 'success');
    }

    /* --- Шаги --- */
    const keys = ['w1', 'w2', 'w3', 'w4', 'lang', 'word'];
    s.renderStep = function () {
      const k = keys[s.step];
      if (k === 'word') { bindText(s.title, 'wordTitle', { w: word }); s.robot.say('wordRobot', { l: word[0] }); drawSheet(); }
      else { bindText(s.title, k + 'Title'); s.robot.say(k + 'Robot'); }
      if (s.step === 0) help.set('right', 'btnRight');
      else if (s.step === 3) help.set('left', 'btnDouble');
      else if (s.step === 2 || s.step === 5) help.set(null);
      else help.set('left', 'btnLeft');
      if (s.step === 2) askName();
      if (s.step === 3) dbl = createDoubleClick(s, { one: 'w4One', strong: 'w4Strong' }, function () { openWindow(); s.pass('w4Ok', null, 1500); });
      highlight();
    };

    s.listen(desk, 'click', function (e) {
      if (s.locked) return;
      const onDoc = doc.contains(e.target);
      if (s.step === 0) s.fail(bin.contains(e.target) ? 'w1Icon' : 'w1Wrong', null, 'w1Strong');
      else if (s.step === 1) {
        if (cmenu) { closeAllMenus(); s.robot.say('w2Closed', null, 'hint'); }
        else s.fail('w1Wrong', null, 'w1Strong');
      } else if (s.step === 2) { if (input && e.target !== input) { input.focus(); s.robot.say('w3Robot', null, 'hint'); } }
      else if (s.step === 3) { if (onDoc) dbl.hit(); else { dbl.drop(); s.fail('w4Miss', null, 'w4Strong'); } }
      else if (s.step === 4) {
        if (!lang.menu.hidden) lang.toggle(false);
        s.fail('w5Miss', null, 'langStrong');
      }
    });
    // Меню браузера выключено, на столе работает учебное
    s.listen(document, 'contextmenu', function (e) {
      e.preventDefault();
      if (s.locked || modalOpen || !desk.contains(e.target)) return;
      const empty = !bin.contains(e.target) && !doc.contains(e.target) && !e.target.closest('.cmenu');
      if (s.step === 0) {
        if (!empty) { s.fail('w1Icon', null, 'w1Strong'); return; }
        openMenu(e);
        s.pass('w1Ok', null, 1100);
      } else if (s.step === 1 && empty) {
        openMenu(e);
        s.robot.say('w2Robot');
      } else if (s.step === 3) { dbl.drop(); s.fail('dblButton', null, 'w4Strong'); }
    });
    s.listen(document, 'keydown', function (e) {
      if (e.key === 'Escape' && !lang.menu.hidden) { lang.toggle(false); return; }
      typeKey(e);
    });
    s.onSiteLang = function () { if (!s.locked && s.step === 4) s.robot.say('langSite', null, 'hint'); };
    s.onResume = function () { if (s.step === 2 && input) input.focus(); };
    s.begin();
  }

  /* =====================================================================
     13. НАБОР ТЕКСТА: алгоритм и уровни 1, 2, 3, 5
     Дети печатают на настоящей клавиатуре в раскладке ҚАЗ.
     cfg.pages — страницы; cfg.guide — всегда подсвечивать клавишу;
     cfg.fix — неверный знак появляется красным, его стирают Backspace.
     ===================================================================== */
  const IDLE_HINT_MS = 6000; // подсветить клавишу, если ребёнок задумался
  const ALGO_PAGES = ['Қар жина.\nҮлкен шар жаса.', 'Үстіне шар қой.\nТағы кіші шар қой.', 'Көзі мен мұрнын сал.\nШелек кигіз.'];
  const TYPING = {
    1: { title: 'tyTitle', robot: 'ty1Robot', guide: true, pages: ['ана әке', 'қала гүл', 'үй ірі құс'] },
    2: { title: 'tyTitle', robot: 'ty2Robot', guide: true, pages: ['Мен оқушымын.', 'Біздің үй үлкен.', 'Қала әдемі.'] },
    3: { title: 'tyTitle', robot: 'ty3Robot', pages: ['Күз келді.\nКүн салқын.', 'Құстар ұшып кетті.\nАғаш сарғайды.'] },
    5: {
      title: 'taleTitle', robot: 'ty5Robot', fix: true,
      pages: [
        'Мақта қыз үй сыпырып жүріп,\nмейіз тауып алды.',
        'Мысық мейіз сұрады.\nҚыз бермеді.',
        'Мысық ренжіп,\nқатықты төгіп тастады.',
        'Қыз мысықтың\nқұйрығын жұлып алды.',
        'Мысық қатық әкеліп берді.\nҚыз құйрығын қайтарды.'
      ]
    }
  };

  function startAlgo() {
    startTyping('lessonAlgo', { title: 'algoTitle', robot: 'algoRobot', guide: true, numbered: true, snow: true, pages: ALGO_PAGES }, startAlgo);
  }
  function startLevel(n) {
    const again = function () { startLevel(n); };
    if (n === 4) startFix(again); else startTyping('typing' + n, TYPING[n], again);
  }

  function makePaper(s, docKey) {
    const paper = h('div', { class: 'paper', tabindex: '0', role: 'group', aria: ['paperAria'] });
    s.stage.append(h('div', { class: 'paper-head', t: ['paperName', { doc: function () { return trainerName(docKey); } }] }), paper);
    keepFocus(s, paper);
    return paper;
  }

  function startTyping(id, cfg, again) {
    const s = createSession(id, cfg.pages.length, again, { lesson: true, wide: true });
    s.size = cfg.pages.join('').length;
    const paper = makePaper(s, id);
    const board = createBoard(s, null);
    let text = '', pos = 0, wrong = '', idle = null, slow = false, lastState = '';

    function say(key, params, state) { lastState = state || ''; s.robot.say(key, params, state); }
    function linesBefore() {
      let n = 0;
      for (let i = 0; i < s.step; i++) n += cfg.pages[i].split('\n').length;
      return n;
    }
    function draw() {
      paper.textContent = '';
      let line = null, num = linesBefore();
      const newLine = function () {
        num++;
        line = h('div', { class: 'pline' });
        if (cfg.numbered) line.append(h('span', { class: 'num', text: num + '.' }));
        paper.append(line);
      };
      newLine();
      text.split('').forEach(function (ch, i) {
        if (i === pos && wrong) line.append(h('span', { class: 'bad', text: wrong.replace(/\n/g, '↵').replace(/ /g, '␣') }));
        const cls = i < pos ? 'done' : i === pos ? 'now' : 'todo';
        const shown = ch === '\n' ? (i < pos ? '' : ' ↵') : ch === ' ' && i === pos ? '␣' : ch;
        line.append(h('span', { class: cls, text: shown }));
        if (ch === '\n') newLine();
      });
      const now = paper.querySelector('.now');
      if (now && now.scrollIntoView) paper.scrollTop = Math.max(0, now.offsetTop - paper.clientHeight / 2);
      if (cfg.snow) {
        paper.classList.add('with-art');
        const pic = h('div', { class: 'snow', svg: ART.snow, 'aria-hidden': 'true' });
        const ready = linesBefore() + (pos === text.length ? text.split('\n').length : text.slice(0, pos).split('\n').length - 1);
        pic.querySelectorAll('g').forEach(function (g, i) { g.classList.toggle('on', i < ready); });
        paper.append(pic);
      }
    }
    function highlight() {
      if (s.locked || pos >= text.length) { board.glow([]); return; }
      if (wrong) { board.glow(['Backspace']); return; }
      if (!(cfg.guide || slow || s.strong())) { board.glow([]); return; }
      const k = keyFor(text[pos]);
      board.glow(k.shift ? [k.code, 'ShiftLeft', 'ShiftRight'] : [k.code]);
    }
    function refresh() {
      slow = false;
      s.cancel(idle);
      idle = s.later(function () { slow = true; highlight(); }, IDLE_HINT_MS);
      draw();
      highlight();
    }
    s.onStrong = highlight;

    function typeChar(ch, e) {
      if (wrong) { // сначала стереть красное
        if (wrong.length < 4) wrong += ch;
        say('tyBack', null, 'hint');
        refresh();
        return;
      }
      const goal = text[pos];
      if (ch === goal) {
        pos++;
        s.calm();
        if (lastState) say('tyGo');
        refresh();
        if (pos === text.length) { s.pass(null, null, 1400); highlight(); }
        return;
      }
      const k = keyFor(goal);
      const w = charName(goal);
      // Та же буква, но не тот размер: Shift или Caps Lock
      if (ch.toLowerCase() === goal.toLowerCase()) {
        if (e.getModifierState && e.getModifierState('CapsLock')) { say('tyCaps', null, 'hint'); return; }
        lastState = 'error';
        s.fail(k.shift ? 'tyShift' : 'tyLower', { w: goal }, k.shift ? 'tyShift' : 'tyLower', { w: goal });
        highlight();
        return;
      }
      // Клавиша верная, но раскладка другая (или латиница) — это не ошибка ребёнка
      const own = KEY_CHAR[e.code]; // что эта клавиша печатает в раскладке ҚАЗ
      const foreign = own && /\p{L}/u.test(own) && ch.toLowerCase() !== own;
      if (foreign || e.code === k.code || /[a-z]/i.test(ch)) { say('tyLang', null, 'hint'); return; }
      lastState = 'error';
      if (cfg.fix) {
        wrong = ch;
        s.fail('tyWrongBack', { w: w });
        refresh();
      } else {
        s.fail('tyWrong', { k: charName(ch), w: w }, 'tyStrong', { w: w });
        highlight();
      }
    }

    s.listen(document, 'keydown', function (e) {
      if (typingBlocked(s, e)) return;
      board.flash(e.code === 'NumpadEnter' ? 'Enter' : e.code, 'down');
      if (e.key === 'Backspace') {
        e.preventDefault();
        if (!wrong) return;
        wrong = wrong.slice(0, -1);
        if (!wrong) say('tyGo');
        refresh();
        return;
      }
      const ch = e.key === 'Enter' ? '\n' : e.key.length === 1 ? e.key : null;
      if (!ch) return; // Shift, Tab, стрелки и прочее
      e.preventDefault();
      if (!e.repeat) typeChar(ch, e);
    });
    s.renderStep = function () {
      text = cfg.pages[s.step];
      pos = 0;
      wrong = '';
      bindText(s.title, cfg.title);
      say(cfg.robot);
      lastState = '';
      refresh();
      paper.focus({ preventScroll: true });
    };
    s.begin();
  }

  /* --- Уровень 4: стереть лишнюю букву Backspace или Delete --- */
  function startFix(again) {
    const tasks = [
      { key: 'Backspace', text: 'Мен кітап оқимынн', goal: 'Мен кітап оқимын', caret: 17 },
      { key: 'Delete', text: 'ББіздің үй үлкен.', goal: 'Біздің үй үлкен.', caret: 0 },
      { key: 'Backspace', text: 'Бүгін күн жыылы.', goal: 'Бүгін күн жылы.', caret: 16 },
      { key: 'Delete', text: 'Құстар ұұшып кетті.', goal: 'Құстар ұшып кетті.', caret: 0 }
    ];
    const s = createSession('typing4', tasks.length, again, { lesson: true, wide: true });
    const paper = makePaper(s, 'typing4');
    const board = createBoard(s, null);
    let text = '', caret = 0, task = null;

    // Лишняя буква — первое место, где текст расходится с образцом
    function extraAt() {
      for (let i = 0; i < text.length; i++) if (text[i] !== task.goal[i]) return i;
      return -1;
    }
    function draw() {
      paper.textContent = '';
      const line = h('div', { class: 'pline' });
      const bad = extraAt();
      for (let i = 0; i <= text.length; i++) {
        if (i === caret) line.append(h('span', { class: 'caret', 'aria-hidden': 'true' }));
        if (i === text.length) break;
        const ch = h('span', { class: i === bad ? 'extra' : '', text: text[i] });
        // щелчок по букве ставит курсор до или после неё
        ch.addEventListener('click', function (e) {
          if (s.locked) return;
          const r = ch.getBoundingClientRect();
          caret = e.clientX < r.left + r.width / 2 ? i : i + 1;
          draw();
          highlight();
        });
        line.append(ch);
      }
      paper.append(line, h('p', { class: 'goal', t: ['fxGoal', { w: task.goal }] }));
    }
    // Можно ли стереть букву с номером i: текст должен стать ближе к образцу
    function removable(i) {
      const bad = extraAt();
      return bad >= 0 && i >= 0 && i < text.length && text.slice(0, i) + text.slice(i + 1) === task.goal;
    }
    function highlight() {
      if (s.locked || !s.strong()) { board.glow([]); return; }
      const bad = extraAt();
      const want = task.key === 'Backspace' ? bad + 1 : bad;
      board.glow([removable(task.key === 'Backspace' ? caret - 1 : caret) ? task.key : caret > want ? 'ArrowLeft' : 'ArrowRight']);
    }
    s.onStrong = highlight;

    s.listen(document, 'keydown', function (e) {
      if (typingBlocked(s, e)) return;
      board.flash(e.code, 'down');
      const robotKey = task.key === 'Backspace' ? 'fxBRobot' : 'fxDRobot';
      const moves = { ArrowLeft: caret - 1, ArrowRight: caret + 1, Home: 0, End: text.length, ArrowUp: 0, ArrowDown: text.length };
      if (e.key in moves) {
        e.preventDefault();
        caret = Math.max(0, Math.min(text.length, moves[e.key]));
        draw();
        highlight();
        return;
      }
      if (e.key === 'Backspace' || e.key === 'Delete') {
        e.preventDefault();
        if (e.repeat) return;
        if (e.key !== task.key) { s.fail('fxKey', { w: task.key }, robotKey); highlight(); return; }
        const i = e.key === 'Backspace' ? caret - 1 : caret;
        if (!removable(i)) { s.fail('fxNot', null, robotKey); highlight(); return; }
        text = text.slice(0, i) + text.slice(i + 1);
        if (e.key === 'Backspace') caret--;
        draw();
        s.pass(null, null, 1500);
        highlight();
        return;
      }
      if (e.key.length === 1 || e.key === 'Enter') {
        e.preventDefault();
        if (!e.repeat) { s.fail('fxType', null, robotKey); highlight(); }
      }
    });
    s.renderStep = function () {
      task = tasks[s.step];
      text = task.text;
      caret = task.caret;
      bindText(s.title, task.key === 'Backspace' ? 'fxB' : 'fxD');
      s.robot.say(task.key === 'Backspace' ? 'fxBRobot' : 'fxDRobot');
      draw();
      highlight();
      paper.focus({ preventScroll: true });
    };
    s.begin();
  }

  /* =====================================================================
     14. СВЯЗЬ С GOOGLE-ТАБЛИЦЕЙ УЧИТЕЛЯ
     Работает, только если учитель вписал адрес. Имя ребёнка не отправляется:
     уходят класс, номер компьютера и результат. Без интернета строки ждут.
     ===================================================================== */
  const Sync = {
    busy: false,
    lastOk: null,      // время последней удачной отправки
    lastError: false,
    pendingClass: null,

    enabled: function () { return Boolean(Store.data.settings.sheetUrl); },
    waiting: function () { return Store.data.log.filter(function (r) { return !r.sent; }); },

    request: function (method, body) {
      const stop = new AbortController();
      const timer = setTimeout(function () { stop.abort(); }, 25000);
      const opts = { method: method, redirect: 'follow', credentials: 'omit', signal: stop.signal };
      if (body) { opts.body = JSON.stringify(body); opts.headers = { 'Content-Type': 'text/plain;charset=utf-8' }; }
      return fetch(Store.data.settings.sheetUrl, opts)
        .then(function (r) { return r.json(); })
        .then(function (j) { if (!j || j.ok !== true) throw new Error('bad answer'); return j; })
        .finally(function () { clearTimeout(timer); });
    },

    send: function () {
      if (!this.enabled() || this.busy) return Promise.resolve();
      const rows = this.waiting().slice(0, 20);
      if (!rows.length) return Promise.resolve();
      this.busy = true;
      const body = {
        rows: rows.map(function (r) {
          return { uid: r.uid, cls: r.cls, pc: r.pc, trainer: r.trainer, stars: r.stars, timeSec: r.timeSec, errors: r.errors, status: r.status, video: r.video, attempt: r.attempt, at: r.at };
        })
      };
      return this.request('POST', body).then((j) => {
        rows.forEach(function (r) { r.sent = true; });
        this.lastOk = new Date();
        this.lastError = false;
        Store.save();
        this.busy = false;
        this.takeClass(j.currentClass);
        this.notify();
        return this.send(); // остаток очереди
      }).catch(() => {
        this.busy = false;
        this.lastError = true;
        this.notify();
      });
    },

    // Класс, который учитель выбрал в таблице, приходит на все компьютеры
    readClass: function () {
      if (!this.enabled()) return Promise.reject(new Error('off'));
      return this.request('GET').then((j) => {
        this.lastError = false;
        if (Array.isArray(j.classes)) {
          const all = Store.data.settings.classes.concat(j.classes.map(cleanClass).filter(Boolean));
          Store.data.settings.classes = Array.from(new Set(all)).slice(0, 30);
          Store.save();
        }
        this.takeClass(j.currentClass);
        return j;
      });
    },
    takeClass: function (value) {
      const cls = cleanClass(value);
      if (!cls) return;
      if (cls === Store.data.settings.currentClass) { this.pendingClass = null; return; }
      // не мешаем ребёнку: класс меняется только на главном экране, экране выбора и в панели
      if (Panel.open || document.querySelector('.lesson, .who-form')) setCurrentClass(cls);
      else this.pendingClass = cls;
    },
    applyPending: function () {
      if (this.pendingClass === null) return;
      const cls = this.pendingClass;
      this.pendingClass = null;
      Store.data.settings.currentClass = cls;
      dropForeignPupil();
      Store.save();
    },

    tick: function () {
      this.send();
      this.readClass().catch(function () { /* нет связи — попробуем позже */ });
    },
    listener: null,
    notify: function () { if (this.listener) this.listener(); },

  // Ребёнок из другого класса не остаётся выбранным
  function dropForeignPupil() {
    const p = Store.current();
    if (p && (p.cls || '') !== Store.data.settings.currentClass) Store.data.currentId = null;
  }
  function setCurrentClass(cls) {
    const before = Store.data.currentId;
    Store.data.settings.currentClass = cls;
    if (cls && !Store.data.settings.classes.includes(cls)) Store.data.settings.classes.push(cls);

  /* =====================================================================
     15. ПАНЕЛЬ УЧИТЕЛЯ
     PIN закрывает панель от детей, но это не настоящая защита данных.
     ===================================================================== */
  function hashPin(pin) {
    let x = 5381;
    const s = 'smart-teacher:' + pin;
    for (let i = 0; i < s.length; i++) x = ((x << 5) + x + s.charCodeAt(i)) >>> 0;
    return x.toString(36);
  }

  /** Окно с произвольным содержимым; close() закрывает */
  function openBox(titleKey, params, content, cls) {
    if (modalOpen) return null;
    modalOpen = true;
    const back = document.activeElement;
    const box = h('div', { class: 'modal box ' + (cls || ''), role: 'dialog', 'aria-modal': 'true', 'aria-labelledby': 'b-title' },
      h('h2', { id: 'b-title', t: [titleKey, params] }), content);
    const overlay = h('div', { class: 'overlay' }, box);
    function close() {
      if (!overlay.isConnected) return;
      modalOpen = false;
      header.inert = app.inert = false;
      document.removeEventListener('keydown', onKey, true);
      overlay.remove();
      if (back && document.contains(back)) back.focus({ preventScroll: true });
    }
    function onKey(e) { if (e.key === 'Escape') { e.preventDefault(); close(); } }
    document.addEventListener('keydown', onKey, true);
    header.inert = app.inert = true;
    document.body.append(overlay);
    const first = box.querySelector('input, button');
    if (first) first.focus();
    return { close: close, box: box };
  }

  function pinInput(key) {
    return h('input', { class: 'field pin', type: 'password', inputmode: 'numeric', maxlength: '8', autocomplete: 'off', aria: [key] });
  }
  // Создать PIN (первый раз или смена): два одинаковых ввода, 4–8 цифр
  function askNewPin(onDone) {
    const a = pinInput('pinNew'), b = pinInput('pinRepeat');
    const err = h('p', { class: 'form-error', role: 'alert' });
    let win = null;
    const form = h('form', {
      class: 'pin-form', novalidate: true,
      on: {
        submit: function (e) {
          e.preventDefault();
          if (!/^\d{4,8}$/.test(a.value)) { bindText(err, 'pinRule'); return; }
          if (a.value !== b.value) { bindText(err, 'pinDiffer'); return; }
          Store.changeSettings({ pinHash: hashPin(a.value) });
          win.close();
          onDone();
        }
      }
    },
      h('p', { t: ['pinRule'] }),
      h('label', null, h('span', { t: ['pinNew'] }), a),
      h('label', null, h('span', { t: ['pinRepeat'] }), b),
      err,
      h('div', { class: 'row' }, h('button', { class: 'btn sun', type: 'submit', t: ['save'] }), button('plain', 'cancel', function () { win.close(); })));
    win = openBox('pinCreate', null, form);
  }
  function enterTeacher() {
    if (DEMO) { Panel.show('results'); return; }
    if (!Store.data.settings.pinHash) { askNewPin(function () { Panel.show('results'); }); return; }
    const pin = pinInput('pinEnter');
    const err = h('p', { class: 'form-error', role: 'alert' });
    let win = null;
    const form = h('form', {
      class: 'pin-form', novalidate: true,
      on: {
        submit: function (e) {
          e.preventDefault();
          if (hashPin(pin.value) !== Store.data.settings.pinHash) {
            pin.value = '';
            pin.focus();
            bindText(err, 'pinWrong');
            return;
          }
          win.close();
          Panel.show('results');
        }
      }
    }, pin, err, h('div', { class: 'row' }, h('button', { class: 'btn sun', type: 'submit', t: ['enter'] }), button('plain', 'cancel', function () { win.close(); })));
    win = openBox('pinEnter', null, form);

  function download(name, text, type) {
    const url = URL.createObjectURL(new Blob([text], { type: type }));
    const a = h('a', { href: url, download: name });
    document.body.append(a);
    a.click();
    a.remove();
    setTimeout(function () { URL.revokeObjectURL(url); }, 2000);
  }
  function localDate(iso) {
    const d = new Date(iso);
    const two = function (n) { return String(n).padStart(2, '0'); };
    return isNaN(d) ? '' : two(d.getDate()) + '.' + two(d.getMonth() + 1) + '.' + d.getFullYear() + ' ' + two(d.getHours()) + ':' + two(d.getMinutes());
  }

  // Вымышленный класс для демо: одинаковый при каждом открытии, в память не пишется
  const DEMO_LOG = !DEMO ? [] : (function () {
    const ids = LESSON_STEPS.map(function (x) { return x.id; }).concat(['mouse', 'keyboard']);
    let seed = 2026;
    const rnd = function () { seed = (seed * 1103515245 + 12345) % 2147483648; return seed / 2147483648; };
    const out = [];
    const start = Date.parse('2026-11-23T04:05:00Z');
    for (let pc = 1; pc <= PC_COUNT; pc++) {
      const skill = 0.4 + rnd() * 0.6;                              // насколько уверенно работает ученик
      const done = 3 + Math.floor(rnd() * 8);           // сколько заданий успел
      ids.slice(0, done).forEach(function (id, i) {
        const tries = skill < 0.7 && rnd() < 0.5 ? 2 : 1; // слабый повторяет и становится лучше
        for (let k = 1; k <= tries; k++) {
          const errors = Math.max(0, Math.round((1 - skill) * 6 + rnd() * 2 - 1 + (tries - k) * 2));
          const r = rate(errors);
          out.push({
            uid: 'demo-' + pc + '-' + i + '-' + k, pid: 'demo:' + pc, cls: '2 «А»', pc: pc, name: '', trainer: id,
            stars: r.stars, status: r.status, errors: errors, timeSec: Math.round(35 + rnd() * 70 + errors * 6),
            video: rnd() < 0.8 ? 'watched' : 'skipped', attempt: k, sent: true,
            at: new Date(start + (i * 4 + k) * 60000 + pc * 9000).toISOString()
          });
        }
      });
    }
    return out;
  })();

      // формулы Excel обезвреживаем, кавычки удваиваем
      const safe = function (v) {
        let s = String(v === null || v === undefined ? '' : v);

  const SHEET_SCRIPT = String.raw`/**

 */
// Номер таблицы из её адреса. Пусто — скрипт открыт из самой таблицы
const SHEET_ID = '';
const JOURNAL = 'Журнал';
const SUMMARY = 'Сынып кестесі';
const OPTIONS = 'Баптау';
const TASKS = {
  lessonKeys: 'Негізгі пернелер', lessonWord: 'Word құжатын ашу', lessonAlgo: 'Алгоритм теру',

};
const STATUS = {

};
const VIDEO = { watched: 'көрді', skipped: 'өткізді' };

/** Запустить один раз: создаёт листы */
function setup() {
  const book = book_();
  let j = book.getSheetByName(JOURNAL);
  if (!j) {
    j = book.insertSheet(JOURNAL);
    j.appendRow(['Күні', 'Сынып', 'Компьютер', 'Тапсырма', 'Жұлдыз', 'Күй', 'Уақыт, сек', 'Қате', 'Әрекет', 'Видео', 'id']);
    j.getRange('A:A').setNumberFormat('dd.MM.yyyy HH:mm');

    j.getRange('K:K').setNumberFormat('@');
    j.setFrozenRows(1);
    j.getRange('1:1').setFontWeight('bold');
  }
  let s = book.getSheetByName(SUMMARY);
  if (!s) {
    s = book.insertSheet(SUMMARY);
    s.getRange('A:A').setNumberFormat('@');
    const names = Object.keys(TASKS).map(function (k) { return TASKS[k]; });
    s.appendRow(['Сынып', 'Компьютер'].concat(names));
    s.setFrozenRows(1);
    s.setFrozenColumns(2);
    s.getRange('1:1').setFontWeight('bold');
  }
  let o = book.getSheetByName(OPTIONS);
  if (!o) {
    o = book.insertSheet(OPTIONS);
    o.getRange('A:B').setNumberFormat('@');
    o.getRange('A1').setValue('Қазіргі сынып');
    o.getRange('A3').setValue('Сыныптар тізімі');
    o.getRange('A1').setFontWeight('bold');
    o.getRange('A3').setFontWeight('bold');
    o.getRange('B1').setDataValidation(
      SpreadsheetApp.newDataValidation().requireValueInRange(o.getRange('A4:A33'), true).setAllowInvalid(true).build());
  }
}

/** Компьютеры узнают, какой класс сейчас на уроке. Результаты наружу не отдаются. */
function doGet() {
  setup();
  return answer_(options_());
}

/** Приём результатов или смены класса */
function doPost(e) {
  const lock = LockService.getScriptLock();
  try {
    lock.waitLock(20000);
    setup();
    const data = JSON.parse(e.postData.contents);
    if (data.setClass) setClass_(data.setClass);
    if (Array.isArray(data.rows)) saveRows_(data.rows.slice(0, 50));
    return answer_(options_());
  } catch (err) {
    return answer_({ ok: false });
  } finally {
    lock.releaseLock();
  }
}

function saveRows_(rows) {
  const book = book_();
  const j = book.getSheetByName(JOURNAL);
  const s = book.getSheetByName(SUMMARY);
  // повторная отправка той же попытки не создаёт вторую строку
  const last = j.getLastRow();
  const from = Math.max(2, last - 1999);
  const seen = new Set(last >= 2 ? j.getRange(from, 11, last - from + 1, 1).getValues().map(function (r) { return String(r[0]); }) : []);
  const fresh = rows.map(clean_).filter(function (r) { return r && !seen.has(r.uid); });
  if (!fresh.length) return;
  j.getRange(last + 1, 1, fresh.length, 11).setValues(fresh.map(function (r) {
    return [r.at, r.cls, r.pc, TASKS[r.trainer], r.stars, STATUS[r.status].text, r.timeSec, r.errors, r.attempt, r.video, r.uid];
  }));
  const ids = Object.keys(TASKS);
  const keys = s.getLastRow() >= 2
    ? s.getRange(2, 1, s.getLastRow() - 1, 2).getValues().map(function (r) { return r[0] + '|' + r[1]; }) : [];
  fresh.forEach(function (r) {
    const key = r.cls + '|' + r.pc;
    let at = keys.indexOf(key);
    if (at < 0) {
      s.getRange(keys.length + 2, 1, 1, 2).setValues([[r.cls, r.pc]]);
      keys.push(key);
      at = keys.length - 1;
    }
    s.getRange(at + 2, ids.indexOf(r.trainer) + 3)
      .setValue(new Array(r.stars + 1).join('★') + ' (қате: ' + r.errors + ')')
      .setBackground(STATUS[r.status].color);
  });
}

/** Принимаем только ожидаемые значения: чужой текст и формулы в таблицу не попадут */
function clean_(r) {
  if (!r || !TASKS[r.trainer] || !STATUS[r.status]) return null;
  const uid = String(r.uid || '');
  if (!/^[a-z0-9-]{5,40}$/.test(uid)) return null;
  const at = new Date(r.at);
  return {
    uid: uid, trainer: r.trainer, status: r.status,
    cls: class_(r.cls),
    pc: r.pc >= 1 && r.pc <= 14 ? Math.floor(r.pc) : '',
    stars: Math.min(3, Math.max(1, Math.floor(r.stars) || 1)),
    timeSec: number_(r.timeSec), errors: number_(r.errors), attempt: number_(r.attempt),
    video: VIDEO[r.video] || '',
    at: isNaN(at) ? new Date() : at
  };
}
function book_() { return SHEET_ID ? SpreadsheetApp.openById(SHEET_ID) : SpreadsheetApp.getActiveSpreadsheet(); }
function number_(v) { return Math.min(100000, Math.max(0, Math.floor(Number(v)) || 0)); }
function class_(v) { return String(v || '').replace(/[^\p{L}\d «»-]/gu, '').trim().replace(/^-+/, '').slice(0, 10); }

function setClass_(v) {
  const c = class_(v);
  if (!c) return;
  const o = book_().getSheetByName(OPTIONS);
  const list = classes_(o);
  if (list.indexOf(c) < 0 && list.length < 30) o.getRange(4 + list.length, 1).setValue(c);
  o.getRange('B1').setValue(c);
}
function classes_(o) {
  return o.getRange('A4:A33').getDisplayValues().map(function (r) { return class_(r[0]); }).filter(String);
}
function options_() {
  const o = book_().getSheetByName(OPTIONS);
  return { ok: true, currentClass: class_(o.getRange('B1').getDisplayValue()), classes: classes_(o) };
}
function answer_(obj) {
  return ContentService.createTextOutput(JSON.stringify(obj)).setMimeType(ContentService.MimeType.JSON);
}`;

  /* =====================================================================
     16. ЗАПУСК
     ===================================================================== */
  I18N.kk.whoChip = I18N.ru.whoChip = '{who}'; // имя/номер без перевода
  Store.load();
  document.documentElement.lang = Store.data.lang;
  dropForeignPupil();
  if (Store.current()) showHome(); else showWho();
  Sync.start();
})();
